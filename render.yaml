services:
  - type: web
    name: devguard-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: devguard-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: devguard-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: LLM_PROVIDER
        value: disabled

  - type: web
    name: devguard-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: devguard-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: devguard-db
    plan: free
    region: singapore
    databaseName: devguard
    user: devguard
